services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryanair-miniapp
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8099}:80"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  internal:
    driver: bridge
